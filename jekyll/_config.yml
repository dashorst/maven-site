# A demonstration: maven.apache.org built with Jekyll instead of the Doxia site renderer,
# restructured into five sections (Docs, Downloads, News, Extend, Community) with a user
# guide split by kind (tutorials, how-to guides, reference, explanation).
# The source is the repository root, so the pages in content/ are read where they are;
# everything Jekyll adds lives in jekyll/. See jekyll/README.md.
title: Maven
url: https://maven.apache.org
baseurl: ""

layouts_dir: jekyll/_layouts
includes_dir: jekyll/_includes
data_dir: jekyll/_data
plugins_dir: jekyll/_plugins
collections_dir: jekyll

# content/ is mounted by _plugins/doxia_content.rb, not read as Jekyll pages.
exclude: [content, src, pom.xml, README.md, Jenkinsfile, GUIDE.md, PRODUCT.md, DESIGN.md, CONTENT-FIXES.md, .impeccable, target,
          jekyll/skin, jekyll/velocity, jekyll/Gemfile, jekyll/Gemfile.lock, jekyll/README.md, jekyll/build.sh, jekyll/publish.sh, .gh-pages]

markdown: CommonMark
commonmark:
  options: [UNSAFE]
  extensions: [table, strikethrough, autolink]

# Where pages link to their source: the Doxia pages in apache/maven-site, the guide in this fork.
edit:
  content: https://github.com/apache/maven-site/tree/master
  guide: https://github.com/dashorst/maven-site/blob/diataxis-demo

# The user guide: one page per file in jekyll/_guide/, see GUIDE.md. Topic pages, kind
# pages, the A-Z index and the search index are generated by _plugins/guide.rb.
collections:
  guide:
    output: true
    permalink: /guides/:name.html

defaults:
  - scope:
      type: guide
    values:
      layout: guide

# The structure of the site is in _data/site_map.yml, see _plugins/site_map.rb.
