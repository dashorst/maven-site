# News for maven.apache.org, written from Maven's own pages. Each entry says where its date comes from.
#   release        - release date in the table on docs/history.html
#   added-to-docs  - the day the page (or the section) was added to the maven-site repository
#   retired        - "Retired Date" in the Retired table on plugins/index.html

- date: 2026-10-13
  kind: tool
  title: "New in the docs: POM Validation Tool (mvnval)"
  text: >-
    mvnval checks POM files and reports every problem it finds, without running a build.
    Unlike mvn validate it does not stop at the first error, and its raw mode works offline.
    The page says it ships with Maven 4.1.0.
  link: tools/mvnval.md
  date_from: added-to-docs

- date: 2026-09-27
  kind: release
  title: Maven 3.10.0
  text: >-
    Maven 3 moves to Resolver 2.x, the same lineage Maven 4 uses. Reproducible builds are on by default,
    and server credentials in settings.xml are now scoped to the repositories and mirrors that declare them.
    It still runs on Java 8.
  link: docs/3.10.0/release-notes.md
  date_from: release

- date: 2026-09-24
  kind: release
  title: Maven 4.0.0-rc-7
  text: >-
    This release candidate is expected to be the last before Maven 4.0.0 GA.
    It contains a large number of bug fixes and improvements since rc-6, including fixes to the upgrade tool mvnup.
    Maven 4 needs Java 17 to run.
  link: docs/4.0.0-rc-7/release-notes.md
  date_from: release

- date: 2026-08-04
  kind: release
  title: Maven 4.0.0-rc-6
  text: >-
    All known issues reported for rc-5 are fixed, including the macOS Gatekeeper problem with the JLine native library.
    Servers in settings.xml can declare aliases, and the default resolver transport is now Apache HttpClient.
  link: docs/4.0.0-rc-6/release-notes.md
  date_from: release

- date: 2026-07-09
  kind: release
  title: Maven 3.10.0-rc-1
  text: >-
    The first release candidate of Maven 3.10 uses Resolver 2.x, turns on reproducible builds by default
    and allows user-wide and installation-wide extensions.
    Dependency classpath ordering changes from depth-first to breadth-first, as in Maven 4.
  link: docs/3.10.0-rc-1/release-notes.md
  date_from: release

- date: 2026-06-07
  kind: project
  title: A new Maven logo
  text: >-
    The logo page now shows the new Maven logo received from the ASF, in SVG and PNG.
    There is no version for a dark background yet.
  link: logoupdate.md
  date_from: added-to-docs

- date: 2026-05-13
  kind: release
  title: Maven 3.9.16
  text: >-
    Regression fixes and other improvements from 3.9.15.
    Plugin prefix resolution no longer always forces a metadata download.
    All 3.9.x users are advised to upgrade.
  link: docs/3.9.16/release-notes.md
  date_from: release

- date: 2026-04-13
  kind: release
  title: Maven 3.9.15
  text: >-
    Upgrades plexus-utils to 3.6.1 to get rid of a CVE, and makes colored console output work on Java 26 and later.
    All 3.9.x users are advised to upgrade.
  link: docs/3.9.15/release-notes.md
  date_from: release

- date: 2026-04-04
  kind: project
  title: Two options for a new Maven logo
  text: >-
    A page shows the two logo options that were put to a vote.
  link: logovote.md
  date_from: added-to-docs

- date: 2026-03-12
  kind: release
  title: Maven 3.9.14
  text: >-
    A quick fix for the one known issue in 3.9.13.
    All 3.9.x users are advised to upgrade.
  link: docs/3.9.14/release-notes.md
  date_from: release

- date: 2026-03-06
  kind: release
  title: Maven 3.9.13
  text: >-
    Mostly bug and regression fixes for user-reported problems.
    Resolver 1.9.27 undoes the parallel PUT change from 1.9.25, because many repository managers struggled with
    concurrent requests, and treats HTTP 410 like 404.
  link: docs/3.9.13/release-notes.md
  date_from: release

- date: 2026-02-20
  kind: maven4
  title: "New in the docs: Maven null annotations"
  text: >-
    Maven 4 has its own @Nonnull and @Nullable annotations. All Maven 4 API modules use them,
    and Maven DI checks them at run time. The page lists which analysis tools and IDEs support them.
  link: null-annotations.md
  date_from: added-to-docs

- date: 2025-12-13
  kind: release
  title: Maven 3.9.12
  text: >-
    Removes the Guice warnings on JDK 25 and later, and checks a plugin's Java version requirement before it runs,
    with a clear error message. Resolver 1.9.25 refines locking for parallel builds.
  link: docs/3.9.12/release-notes.md
  date_from: release

- date: 2025-11-29
  kind: plugins
  title: Stage and Verifier plugins retired
  text: >-
    The Stage plugin (last version 1.0) assisted with release staging and promotion.
    The Verifier plugin (last version 1.1) verified conditions in integration tests.
    Both are now in the Retired list.
  link: plugins/index.md
  date_from: retired

- date: 2025-11-14
  kind: project
  title: Maven logos to follow the ASF oak leaf
  text: >-
    In September 2025 the ASF announced a new logo, the oak leaf, replacing the feather.
    The page lists every Maven logo that has to be redrawn as a result.
  link: logoupdate.md
  date_from: added-to-docs

- date: 2025-11-13
  kind: release
  title: Maven 4.0.0-rc-5
  text: >-
    Consumer POM flattening is off by default and becomes an opt-in feature, because it could cause problems
    when computing the dependency tree. Configuration files now use UTF-8.
  link: docs/4.0.0-rc-5/release-notes.md
  date_from: release

- date: 2025-09-20
  kind: maven4
  title: "New in the docs: Maven Mixins (Maven 4.1)"
  text: >-
    Mixins will let a POM take shared configuration from several sources instead of a single parent.
    The page documents this planned Maven 4.1 feature.
  link: guides/mini/guide-mixins.md
  date_from: added-to-docs

- date: 2025-09-16
  kind: plugins
  title: Linkcheck plugin retired
  text: >-
    The Linkcheck plugin (last version 1.2) generated a Linkcheck report of a project's documentation.
    It is now in the Retired list.
  link: plugins/index.md
  date_from: retired

- date: 2025-09-08
  kind: tool
  title: "New in the docs: Maven Shell (mvnsh)"
  text: >-
    Maven Shell keeps one Maven process running while the shell is open, so builds skip booting Java and Maven
    each time. It is built in since Maven 4.0.0 and is a technical preview that may change.
  link: tools/mvnsh.md
  date_from: added-to-docs

- date: 2025-07-30
  kind: tool
  title: "New in the docs: Maven Upgrade Tool (mvnup)"
  text: >-
    mvnup upgrades pom.xml files for Maven 4 with a check and apply workflow.
    It ships with Maven 4 from 4.0.0-rc-4 on, so there is nothing extra to install.
  link: tools/mvnup.md
  date_from: added-to-docs

- date: 2025-07-12
  kind: release
  title: Maven 3.9.11
  text: >-
    Bug and regression fixes, and a new option to control which repositories are queried to resolve version ranges.
    Resolver 1.9.24 adds human-readable details for HTTP problems (RFC 9457).
  link: docs/3.9.11/release-notes.md
  date_from: release

- date: 2025-06-18
  kind: release
  title: Maven 4.0.0-rc-4
  text: >-
    Introduces the Maven Upgrade Tool, which can fix pom.xml files so they work with Maven 4.
    Build extensions can now use DI beans.
  link: docs/4.0.0-rc-4/release-notes.md
  date_from: release

- date: 2025-06-16
  kind: maven4
  title: "New in the docs: Maven Dependency Injection"
  text: >-
    Maven DI is the dependency injection framework introduced in Maven 4, the successor to Plexus and Sisu.
    The page shows how to use it in plugins and extensions. Plugins that use it run only on Maven 4.
  link: maven-di.md
  date_from: added-to-docs

- date: 2025-06-14
  kind: release
  title: Maven 3.8.9
  text: >-
    The release notes say to expect this to be the last release of the 3.8.x line.
  link: docs/3.8.9/release-notes.md
  date_from: release

- date: 2025-06-01
  kind: release
  title: Maven 3.9.10
  text: >-
    Updates the dependencies that caused errors and warnings on Java 24, so builds run far better on Java 24.
    Maven still needs only Java 8 to run.
  link: docs/3.9.10/release-notes.md
  date_from: release

- date: 2025-04-24
  kind: maven4
  title: "New in the docs: Starting with Maven 4"
  text: >-
    A guide to moving a build to Maven 4 in three steps: prepare with the latest Maven 3,
    test with the latest Maven 4 release candidate, then migrate.
    The page is updated as feedback from the community comes in.
  link: guides/mini/guide-migration-to-mvn4.md
  date_from: added-to-docs

- date: 2025-03-14
  kind: tool
  title: "New in the docs: Maven Daemon (mvnd)"
  text: >-
    mvnd keeps the JVM running between builds and manages a pool of Maven processes to reduce build time.
    It works with existing plugins and extensions, and a native executable is available from the download page.
  link: tools/mvnd.md
  date_from: added-to-docs

- date: 2025-03-10
  kind: release
  title: Maven 4.0.0-rc-3
  text: >-
    Requires Java 17 to run and is not suitable for production.
    It changes the new Maven 4 API in ways that plugins targeting that API need to follow.
  link: docs/4.0.0-rc-3/release-notes.md
  date_from: release

- date: 2025-03-04
  kind: plugins
  title: PDF plugin retired
  text: >-
    The PDF plugin (last version 1.6.2) generated a PDF version of a project's documentation.
    It is now in the Retired list.
  link: plugins/index.md
  date_from: retired

- date: 2025-02-26
  kind: maven4
  title: "New in the docs: What's new in Maven 4?"
  text: >-
    An overview of Maven 4: Java 17 to run Maven, separate build and consumer POMs, model version 4.1.0,
    subprojects instead of modules, and lifecycle changes.
    The article is updated at least until Maven 4.0.0 is released.
  link: whatsnewinmaven4.md
  date_from: added-to-docs

- date: 2025-01-28
  kind: maven4
  title: "New in the docs: password encryption in Maven 4"
  text: >-
    Maven 4 replaces the Maven 3 password encryption with a new system that has pluggable providers
    and the mvnenc command-line tool. A legacy provider covers a settings.xml shared with Maven 3.
  link: guides/mini/guide-encryption-4.md
  date_from: added-to-docs

- date: 2024-12-27
  kind: maven4
  title: "Guide updated: multiple subprojects in Maven 4"
  text: >-
    The Maven 4 guide to the reactor now uses the new term subproject instead of module.
    It explains how Maven collects, sorts and builds subprojects, and how it finds the root of a build.
  link: guides/mini/guide-multiple-subprojects-4.md
  date_from: added-to-docs

- date: 2024-12-10
  kind: plugins
  title: Patch plugin retired
  text: >-
    The Patch plugin (last version 1.3) used the GNU patch tool to apply patch files to source code.
    It is now in the Retired list.
  link: plugins/index.md
  date_from: retired

- date: 2021-04-04
  kind: security
  title: "CVE-2021-26291: external HTTP repositories blocked"
  text: >-
    POMs on Maven Central can refer to custom repositories over plain HTTP, which makes those downloads a target
    for man-in-the-middle attacks. Maven 3.8.1 blocks external HTTP repositories by default
    through a mirror in conf/settings.xml.
  link: security.md
  date_from: release

- date: 2018-06-05
  kind: security
  title: Zip Slip in plexus-archiver
  text: >-
    A crafted archive can write files outside the target directory when it is unpacked.
    Maven itself is not vulnerable, but several plugins that unpack dependencies with plexus-archiver were.
    The page lists the fixed plugin versions.
  link: security-plexus-archiver.md
  date_from: added-to-docs
