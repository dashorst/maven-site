# The structure of the site: five sections, each a list of groups, each a list of pages in
# reading order. _plugins/site_map.rb gives every page its URL here, writes a redirect page at
# its old URL, and builds the navigation, the landing pages and the search index from this file.
#
# A page is one of:
#   guide: <name>      a page of the user guide in jekyll/_guide/
#   src: <path>        a page of Maven's site, relative to content/markdown/ (or xdoc/<file> in content/xdoc/)
#   href: <url>        a page outside this build
# with
#   title: the label in the navigation (defaults to the page's own title)
#   slug: the file name of the new URL (defaults to the source file name)
#   url: a URL of its own instead of /<section>/<group>/<slug>.html
#   replaces: Maven pages this guide page replaces; their old URLs redirect to it
#
# Pages of content/ that appear nowhere here keep their old URL and are listed by the build.

