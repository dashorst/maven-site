# Kinds and topics of the user guide (jekyll/_guide/), in reading order. Every page names
# one topic in its `topic` front matter; the topic page at /guides/topics/<id>.html lists
# that topic's pages by kind. See GUIDE.md.

kinds:
  - id: tutorial
    title: Tutorials
    label: Tutorial
    intro: Lessons that build something that works, step by step.
  - id: howto
    title: How-to guides
    label: How-to
    intro: Directions for a specific goal.
  - id: reference
    title: Reference
    label: Reference
    intro: Files, elements, options and settings, described.
  - id: explanation
    title: Explanation
    label: Explanation
    intro: Why Maven works the way it does.

topics:
  - id: start
    title: Getting started
    summary: Install Maven, create a project and build it.
  - id: configure
    title: Configure Maven
    summary: Settings, repository mirrors, proxies and credentials.
  - id: multi-module
    title: Multi-module projects
    summary: Build several projects together, share configuration and build part of them.
  - id: jdk
    title: JDKs and toolchains
    summary: Build with a JDK other than the one Maven runs on.
