<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nearest-wins-title nearest-wins-desc" id="nearest-wins-root">
      <title id="nearest-wins-title">Nearest wins: two versions of Commons Codec</title>
      <desc id="nearest-wins-desc">The project depends on httpclient and on httpclient5, which ask for commons-codec 1.11 and 1.15, both two steps from the project; Maven uses 1.11, which comes through the dependency declared first.</desc>
      <defs>
      <style>#nearest-wins-root { color-scheme: light dark; }
      #nearest-wins-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; color: #1d2433; }
      #nearest-wins-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#nearest-wins-root .diagram-container { overflow-x: visible; }
}
      #nearest-wins-root .bg { fill: #ffffff; }
      #nearest-wins-root .mask { fill: #ffffff; }
      #nearest-wins-root .zone { fill: rgba(29,36,51,0.02); stroke: rgba(29,36,51,0.16); stroke-width: 0.8; }
      #nearest-wins-root .zone-label { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.14em; }
      #nearest-wins-root .node { fill: #ffffff; stroke: #1d2433; stroke-width: 1; }
      #nearest-wins-root .node-focal { fill: #fff3e3; stroke: #a65a00; stroke-width: 1.2; }
      #nearest-wins-root .node-omitted { fill: rgba(29,36,51,0.02); stroke: rgba(29,36,51,0.45); stroke-width: 1; stroke-dasharray: 4 3; }
      #nearest-wins-root .name { fill: #1d2433; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; font-size: 12px; font-weight: 600; }
      #nearest-wins-root .name-omitted { fill: #555f70; }
      #nearest-wins-root .sub { fill: #555f70; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9px; }
      #nearest-wins-root .sub-focal { fill: #a65a00; }
      #nearest-wins-root .edge { fill: none; stroke: #555f70; stroke-width: 1.2; }
      #nearest-wins-root .edge-omitted { fill: none; stroke: #555f70; stroke-width: 1; stroke-dasharray: 4 3; }
      #nearest-wins-root .edge-accent { fill: none; stroke: #a65a00; stroke-width: 1.2; }
      #nearest-wins-root .head { fill: #555f70; }
      #nearest-wins-root .head-accent { fill: #a65a00; }
      #nearest-wins-root .label { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.06em; }
      #nearest-wins-root .rank { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.14em; }
      @media (prefers-color-scheme: dark) {
#nearest-wins-root { color: #d6dce6; }
      #nearest-wins-root .bg, #nearest-wins-root .mask { fill: #0d1522; }
      #nearest-wins-root .zone { fill: rgba(214,220,230,0.03); stroke: rgba(214,220,230,0.18); }
      #nearest-wins-root .zone-label, #nearest-wins-root .label, #nearest-wins-root .rank { fill: #8e9aab; }
      #nearest-wins-root .node { fill: #131d2c; stroke: #d6dce6; }
      #nearest-wins-root .node-focal { fill: #2b2012; stroke: #f79a23; }
      #nearest-wins-root .node-omitted { fill: rgba(214,220,230,0.02); stroke: rgba(214,220,230,0.45); }
      #nearest-wins-root .name { fill: #d6dce6; }
      #nearest-wins-root .name-omitted, #nearest-wins-root .sub { fill: #9aa5b5; }
      #nearest-wins-root .sub-focal { fill: #f79a23; }
      #nearest-wins-root .edge, #nearest-wins-root .edge-omitted { stroke: #9aa5b5; }
      #nearest-wins-root .edge-accent { stroke: #f79a23; }
      #nearest-wins-root .head { fill: #9aa5b5; }
      #nearest-wins-root .head-accent { fill: #f79a23; }
}</style>
        <marker id="nearest-wins-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="head"/></marker>
        <marker id="nearest-wins-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="head-accent"/></marker>
