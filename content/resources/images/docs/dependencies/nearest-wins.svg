<text x="200" y="170" class="name" text-anchor="middle">httpclient</text>
<text x="200" y="186" class="sub" text-anchor="middle">4.5.14 · declared 1st</text>
<rect x="440" y="148" width="160" height="52" rx="6" class="mask"/>
<rect x="440" y="148" width="160" height="52" rx="6" class="node"/>
<text x="520" y="170" class="name" text-anchor="middle">httpclient5</text>
<text x="520" y="186" class="sub" text-anchor="middle">5.1.4 · declared 2nd</text>
<rect x="120" y="256" width="160" height="52" rx="6" class="mask"/>
