<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime scope: compile against the API, run with an implementation</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background: #ffffff; color: #1d2433; padding: 2rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 720px; max-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    .bg { fill: #ffffff; }
    .mask { fill: #ffffff; }
    .zone { fill: rgba(29,36,51,0.02); stroke: rgba(29,36,51,0.16); stroke-width: 0.8; }
    .zone-label { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.14em; }
    .node { fill: #ffffff; stroke: #1d2433; stroke-width: 1; }
    .node-focal { fill: #fff3e3; stroke: #a65a00; stroke-width: 1.2; }
    .node-omitted { fill: rgba(29,36,51,0.02); stroke: rgba(29,36,51,0.45); stroke-width: 1; stroke-dasharray: 4 3; }
    .name { fill: #1d2433; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .name-omitted { fill: #555f70; }
    .sub { fill: #555f70; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9px; }
    .sub-focal { fill: #a65a00; }
    .edge { fill: none; stroke: #555f70; stroke-width: 1.2; }
    .edge-omitted { fill: none; stroke: #555f70; stroke-width: 1; stroke-dasharray: 4 3; }
    .edge-accent { fill: none; stroke: #a65a00; stroke-width: 1.2; }
    .head { fill: #555f70; }
    .head-accent { fill: #a65a00; }
    .label { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.06em; }
    .rank { fill: #5f6a7c; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 8px; letter-spacing: 0.14em; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1522; color: #d6dce6; }
      .bg, .mask { fill: #0d1522; }
      .zone { fill: rgba(214,220,230,0.03); stroke: rgba(214,220,230,0.18); }
      .zone-label, .label, .rank { fill: #8e9aab; }
      .node { fill: #131d2c; stroke: #d6dce6; }
      .node-focal { fill: #2b2012; stroke: #f79a23; }
      .node-omitted { fill: rgba(214,220,230,0.02); stroke: rgba(214,220,230,0.45); }
      .name { fill: #d6dce6; }
      .name-omitted, .sub { fill: #9aa5b5; }
      .sub-focal { fill: #f79a23; }
      .edge, .edge-omitted { stroke: #9aa5b5; }
      .edge-accent { stroke: #f79a23; }
      .head { fill: #9aa5b5; }
      .head-accent { fill: #f79a23; }
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg viewBox="0 0 720 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-scope-title runtime-scope-desc">
      <title id="runtime-scope-title">Runtime scope: compile against the API, run with an implementation</title>
      <desc id="runtime-scope-desc">Your code calls slf4j-api, which has scope compile and is on the main classpath; logback-classic has scope runtime and is only on the runtime classpath, where slf4j-api finds it when the program runs.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="head"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" class="head-accent"/></marker>
      </defs>
      <rect width="100%" height="100%" class="bg"/>
<rect x="40" y="40" width="640" height="144" rx="8" class="zone"/>
<rect x="48" y="44" width="112" height="12" rx="2" class="mask"/>
<text x="104" y="53" class="zone-label" text-anchor="middle">RUNTIME CLASSPATH</text>
<rect x="52" y="68" width="384" height="104" rx="8" class="zone"/>
<rect x="60" y="72" width="96" height="12" rx="2" class="mask"/>
<text x="108" y="81" class="zone-label" text-anchor="middle">MAIN CLASSPATH</text>
<path d="M220,126 H266" class="edge" marker-end="url(#arrow)"/>
<path d="M420,126 H506" class="edge-accent" marker-end="url(#arrow-accent)"/>
<rect x="226" y="108" width="36" height="12" rx="2" class="mask"/>
<text x="244" y="117" class="label" text-anchor="middle">CALLS</text>
<rect x="430" y="108" width="68" height="12" rx="2" class="mask"/>
<text x="464" y="117" class="label" text-anchor="middle">AT RUN TIME</text>
<rect x="68" y="100" width="152" height="52" rx="6" class="mask"/>
<rect x="68" y="100" width="152" height="52" rx="6" class="node"/>
<text x="144" y="122" class="name" text-anchor="middle">Your code</text>
<text x="144" y="138" class="sub" text-anchor="middle">src/main/java</text>
<rect x="268" y="100" width="152" height="52" rx="6" class="mask"/>
<rect x="268" y="100" width="152" height="52" rx="6" class="node"/>
<text x="344" y="122" class="name" text-anchor="middle">slf4j-api</text>
<text x="344" y="138" class="sub" text-anchor="middle">scope: compile</text>
<rect x="508" y="100" width="152" height="52" rx="6" class="mask"/>
<rect x="508" y="100" width="152" height="52" rx="6" class="node-focal"/>
<text x="584" y="122" class="name" text-anchor="middle">logback-classic</text>
<text x="584" y="138" class="sub sub-focal" text-anchor="middle">scope: runtime</text>
    </svg>
  </div>
</body>
</html>
